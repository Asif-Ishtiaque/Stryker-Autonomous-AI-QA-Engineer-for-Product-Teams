name: stryker

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stryker
      POSTGRES_PASSWORD: stryker
      POSTGRES_DB: stryker
    # Bound to loopback only: this has no auth beyond the default stryker/stryker
    # credentials baked into this file, and containers reach it via the internal
    # Docker network (service name "postgres") regardless of this host port mapping —
    # 127.0.0.1 still covers local `psql`/GUI-client debugging from this same machine.
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stryker"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # Bound to loopback only: no requirepass/ACL is configured, and anyone who can
    # reach this port can publish raw Celery task messages directly (bypassing the
    # API's auth entirely — see app.execution.tasks) or read the pub/sub run-event
    # stream. Containers reach it via the internal network regardless of this mapping.
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  chroma:
    image: chromadb/chroma:0.5.20
    ports: ["127.0.0.1:8001:8000"]
    volumes: ["chroma-data:/chroma/chroma"]

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: stryker
      MINIO_ROOT_PASSWORD: stryker-secret
    # Loopback only. Presigned evidence URLs are already signed for "localhost:9000"
    # (see minio_public_endpoint in app/core/config.py) — a browser on this same
    # machine resolves that to 127.0.0.1 and is unaffected; a browser on a different
    # machine couldn't have used those URLs anyway, so this changes nothing there.
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2.18.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    # Loopback only — DISABLE_SECURITY_PLUGIN above means this has zero auth.
    ports: ["127.0.0.1:9200:9200"]
    volumes: ["opensearch-data:/usr/share/opensearch/data"]

  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama-data:/root/.ollama"]
    # Pull your model once the container is up: docker compose exec ollama ollama pull llama3.1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles: ["gpu"]

  ollama-cpu:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama-data:/root/.ollama"]
    profiles: ["cpu"]
    # NOTE: backend/worker point LLM_BASE_URL at host.docker.internal:11434, NOT this
    # container, by default (see docs/DEPLOYMENT.md "Running Ollama natively"). On Apple
    # Silicon, Ollama inside this Linux container gets no Metal GPU access and is CPU-only —
    # 5-10x+ slower than a native `brew install ollama` on the host. This service is kept for
    # portability (Linux hosts, or anyone who'd rather not install anything outside Docker):
    # start it, then point LLM_BASE_URL at http://ollama-cpu:11434/v1 in your .env instead.

  coturn:
    image: coturn/coturn:4.6.2
    # TURN relay for the Mission Control WebRTC video panel. Without this, the backend
    # container's only ICE candidate is its internal Docker bridge IP (e.g. 172.19.0.x),
    # which the browser can never reach — WebRTC connections would sit in "checking"
    # forever and fail. coturn gives the backend a relay candidate at a port Docker
    # actually publishes to the host, which the browser CAN reach. external-ip is set to
    # 127.0.0.1 because this stack, its host, and the browser are all the same machine in
    # this deployment (self-hosted, port-mapped via localhost) — set it to the real
    # LAN/public IP if the frontend is ever accessed from a different machine.
    command: >
      -n --listening-port=3478 --realm=stryker.local
      --user=stryker:stryker-turn-secret
      --external-ip=127.0.0.1
      --min-port=49160 --max-port=49200
      --no-cli --no-tls --no-dtls
    # Loopback only — consistent with external-ip=127.0.0.1 above: this TURN server was
    # never reachable from another machine anyway, and its default credentials shouldn't
    # be reachable beyond this host regardless.
    ports:
      - "127.0.0.1:3478:3478/udp"
      - "127.0.0.1:3478:3478/tcp"
      - "127.0.0.1:49160-49200:49160-49200/udp"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes: ["./infra/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro"]
    ports: ["127.0.0.1:4317:4317"]

  prometheus:
    image: prom/prometheus:v3.0.1
    volumes: ["./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:9090:9090"]

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: stryker
      # Anonymous viewer access is scoped by the loopback-only port binding below, not by
      # this setting alone — broaden this port to 0.0.0.0 only after also disabling
      # anonymous access or changing the default admin password.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - "./infra/grafana/provisioning:/etc/grafana/provisioning:ro"
      - "grafana-data:/var/lib/grafana"
    ports: ["127.0.0.1:3001:3000"]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://stryker:stryker@postgres:5432/stryker
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      MINIO_ENDPOINT: minio:9000
      # MINIO_PUBLIC_ENDPOINT is deliberately NOT set here — its default (localhost:9000)
      # already matches the "9000:9000" port mapping below, and it's what presigned evidence
      # URLs are signed for so the BROWSER (not this container) can load them. Override it if
      # you access the app through anything other than localhost (a custom domain, a remote
      # Docker host, etc.) — see docs/DEPLOYMENT.md.
      OPENSEARCH_URL: http://opensearch:9200
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      LLM_BASE_URL: http://host.docker.internal:11434/v1
    # host.docker.internal resolves automatically on Docker Desktop (Mac/Windows). Linux's
    # Docker Engine needs this explicit mapping to reach the host from inside a container.
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      coturn: { condition: service_started }
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://stryker:stryker@postgres:5432/stryker
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      MINIO_ENDPOINT: minio:9000
      # MINIO_PUBLIC_ENDPOINT is deliberately NOT set here — its default (localhost:9000)
      # already matches the "9000:9000" port mapping below, and it's what presigned evidence
      # URLs are signed for so the BROWSER (not this container) can load them. Override it if
      # you access the app through anything other than localhost (a custom domain, a remote
      # Docker host, etc.) — see docs/DEPLOYMENT.md.
      OPENSEARCH_URL: http://opensearch:9200
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      LLM_BASE_URL: http://host.docker.internal:11434/v1
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* vars are inlined into the client bundle at build time (see the comment
      # in frontend/Dockerfile) — setting them under `environment:` below has no effect on
      # them; they must be passed here instead. TURN_* must match the coturn service's
      # --user/--external-ip so the browser's own peer connection can gather a relay candidate
      # too (see the comment in components/live-browser-stream.tsx for why that's needed).
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_WS_URL: ws://localhost:8000
        NEXT_PUBLIC_TURN_URL: turn:localhost:3478
        NEXT_PUBLIC_TURN_USERNAME: stryker
        NEXT_PUBLIC_TURN_CREDENTIAL: stryker-turn-secret
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    ports: ["3000:3000"]
    depends_on: [backend]

volumes:
  postgres-data:
  chroma-data:
  minio-data:
  opensearch-data:
  ollama-data:
  grafana-data:
