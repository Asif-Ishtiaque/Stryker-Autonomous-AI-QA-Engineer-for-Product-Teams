name: stryker

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stryker
      POSTGRES_PASSWORD: stryker
      POSTGRES_DB: stryker
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stryker"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  chroma:
    image: chromadb/chroma:0.5.20
    ports: ["8001:8000"]
    volumes: ["chroma-data:/chroma/chroma"]

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: stryker
      MINIO_ROOT_PASSWORD: stryker-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2.18.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["9200:9200"]
    volumes: ["opensearch-data:/usr/share/opensearch/data"]

  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama-data:/root/.ollama"]
    # Pull your model once the container is up: docker compose exec ollama ollama pull llama3.1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles: ["gpu"]

  ollama-cpu:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama-data:/root/.ollama"]
    profiles: ["cpu"]
    # NOTE: backend/worker point LLM_BASE_URL at host.docker.internal:11434, NOT this
    # container, by default (see docs/DEPLOYMENT.md "Running Ollama natively"). On Apple
    # Silicon, Ollama inside this Linux container gets no Metal GPU access and is CPU-only —
    # 5-10x+ slower than a native `brew install ollama` on the host. This service is kept for
    # portability (Linux hosts, or anyone who'd rather not install anything outside Docker):
    # start it, then point LLM_BASE_URL at http://ollama-cpu:11434/v1 in your .env instead.

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes: ["./infra/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro"]
    ports: ["4317:4317"]

  prometheus:
    image: prom/prometheus:v3.0.1
    volumes: ["./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: stryker
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - "./infra/grafana/provisioning:/etc/grafana/provisioning:ro"
      - "grafana-data:/var/lib/grafana"
    ports: ["3001:3000"]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://stryker:stryker@postgres:5432/stryker
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      MINIO_ENDPOINT: minio:9000
      # MINIO_PUBLIC_ENDPOINT is deliberately NOT set here — its default (localhost:9000)
      # already matches the "9000:9000" port mapping below, and it's what presigned evidence
      # URLs are signed for so the BROWSER (not this container) can load them. Override it if
      # you access the app through anything other than localhost (a custom domain, a remote
      # Docker host, etc.) — see docs/DEPLOYMENT.md.
      OPENSEARCH_URL: http://opensearch:9200
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      LLM_BASE_URL: http://host.docker.internal:11434/v1
    # host.docker.internal resolves automatically on Docker Desktop (Mac/Windows). Linux's
    # Docker Engine needs this explicit mapping to reach the host from inside a container.
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://stryker:stryker@postgres:5432/stryker
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      MINIO_ENDPOINT: minio:9000
      # MINIO_PUBLIC_ENDPOINT is deliberately NOT set here — its default (localhost:9000)
      # already matches the "9000:9000" port mapping below, and it's what presigned evidence
      # URLs are signed for so the BROWSER (not this container) can load them. Override it if
      # you access the app through anything other than localhost (a custom domain, a remote
      # Docker host, etc.) — see docs/DEPLOYMENT.md.
      OPENSEARCH_URL: http://opensearch:9200
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      LLM_BASE_URL: http://host.docker.internal:11434/v1
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    ports: ["3000:3000"]
    depends_on: [backend]

volumes:
  postgres-data:
  chroma-data:
  minio-data:
  opensearch-data:
  ollama-data:
  grafana-data:
