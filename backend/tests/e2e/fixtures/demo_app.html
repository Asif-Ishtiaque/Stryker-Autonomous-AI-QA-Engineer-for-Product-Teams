<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Demo App</title>
<style>
  body { font-family: sans-serif; margin: 2rem; }
  #welcome-banner { display: none; background: #d4edda; padding: 0.75rem; border-radius: 4px; }
  table { border-collapse: collapse; margin-top: 1rem; }
  td, th { border: 1px solid #ccc; padding: 0.4rem 0.8rem; }
</style>
</head>
<body>
  <h1>Demo App</h1>

  <form id="login-form">
    <div>
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="off">
    </div>
    <div>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="off">
    </div>
    <button type="submit" id="login-btn">Log In</button>
  </form>

  <div id="welcome-banner"></div>

  <h2>Invoices</h2>
  <table id="invoice-table">
    <thead>
      <tr><th>Invoice</th><th>Customer</th><th>Amount</th></tr>
    </thead>
    <tbody id="invoice-tbody">
      <tr><td>INV-1001</td><td>Acme Co</td><td>$500</td></tr>
    </tbody>
  </table>
  <button id="add-row-btn" type="button">Add Invoice Row</button>

  <script>
    document.getElementById('login-form').addEventListener('submit', function (event) {
      event.preventDefault();
      var username = document.getElementById('username').value || 'guest';
      var banner = document.getElementById('welcome-banner');
      banner.textContent = 'Welcome, ' + username + '!';
      banner.style.display = 'block';
    });

    document.getElementById('add-row-btn').addEventListener('click', function () {
      var tbody = document.getElementById('invoice-tbody');
      var row = document.createElement('tr');
      row.innerHTML = '<td>New line item</td><td>-</td><td>-</td>';
      tbody.appendChild(row);
    });
  </script>
</body>
</html>
